[package]
name = "gtunnel"
version = "0.3.21"
edition = "2024"
# std File::lock sets this floor; ratatui 0.30 needs 1.88.
rust-version = "1.89"
description = "TUI-first CLI for GCP IAP tunnels and public URLs via a GCP relay"
authors = ["gcheliz"]
license = "MIT"
repository = "https://github.com/gcheliz/gtunnel"
homepage = "https://github.com/gcheliz/gtunnel"
readme = "README.md"
keywords = ["gcp", "iap", "tunnel", "tui", "ngrok"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# rustls-no-provider keeps aws-lc-rs out of the build; crate::http installs ring.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Named directly so the ring provider is reachable from crate::http.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Read-modify-write of the hand-edited files: unknown keys and comments survive a save.
# Same line as the one toml already resolves, so no second copy is built.
toml_edit = "0.25"
serde_ignored = "0.1"
dirs = "7"
anyhow = "1"
# The release digest is checked in process, not by a shasum found on PATH.
sha2 = "0.11"
rand = "0.10"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
libc = "0.2"
humantime = "2"
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
jsonschema = "0.60.2"
portable-pty = "0.9.0"
vt100 = "0.18.1"

# Runs the console blocks of docs/ against the binary; see tests/doc_transcripts.rs.
trycmd = "1"

[lints.rust]
# Edition 2024 makes this warn by default; stating it keeps the policy
# readable in one place and holds if the edition ever changes.
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
# Each of these is an error in CI through `-D warnings`. An unsafe block must
# carry the invariant that makes it sound, and a stray debug or placeholder
# macro must not reach a release binary.
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# The TUI owns the screen and the MCP server owns stdout, so a print reachable
# from either corrupts them. Printing is allowed where it is the job: the CLI
# `cmd_` wrappers and modules that are CLI output by nature, the supervisor,
# and tests. Anywhere else it fails CI.
print_stdout = "warn"
print_stderr = "warn"

# Sizes are macOS arm64, measured one key at a time on top of the previous.
[profile.release]
# 11.54 -> 9.42 MB
strip = "symbols"
# with codegen-units = 1: 9.42 -> 6.72 MB
lto = "fat"
codegen-units = 1
# 6.72 -> 5.64 MB; no catch_unwind anywhere, see docs/decisions.md section 17
panic = "abort"
