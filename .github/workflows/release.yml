name: Release

# One workflow, two halves, chosen by what was pushed.
#
# A push to main is the release train. CI runs once, and release-plz works out
# whether the commits since the last tag deserve a version. When they do, a draft
# release opens at once, and only when CI is green does one push land the bump
# commit and its tag together. No release pull request and no second merge.
#
# A push of a v* tag is the build. The four targets are built from the tagged
# commit, attested, uploaded to the draft, and the draft is published as latest.
# Building from the tag run, not from the train, is what makes each attestation
# name `release.yml@refs/tags/v<version>` and the commit the binary came from.
#
# The bump push uses RELEASE_TOKEN, a fine-grained personal access token scoped to
# this repository with Contents: write and nothing else. A push made with
# GITHUB_TOKEN starts no workflow, so the tag would never come back here to be
# built. The token's owner is the admin the main ruleset lets bypass a pull
# request, which is what lets the bump commit land on main without one.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # A dry run walks the whole path without publishing: it computes the version,
  # runs CI, opens a draft named vX.Y.Z-dry-run and builds the four targets, then
  # stops before the bump commit, the tag, the attestations and the release. A
  # dispatch with `dry_run` off on main is a real train and builds on its tag.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Stop before anything is pushed or published
        type: boolean
        default: true

# Nothing inherits write access. A job widens only what it uses, and every action
# below is pinned to a commit because these binaries are what `gtunnel update`
# installs
permissions:
  contents: read

# Never cancelled: a train stopped between the bump push and the tag, or a build
# stopped between upload and publish, is a half-made release. Trains on main
# queue; each tag builds in a group of its own. A queued train starts from the
# newest main, so it covers every commit the trains before it did not release.
# A dry run queues apart, so it can never displace a train waiting its turn.
concurrency:
  group: release-${{ github.ref }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- The train: push to main ------------------------------------------------

  # Works out the next version without committing it. The bump commit this train
  # pushes starts the workflow again, and the subject guard stops it here.
  plan:
    if: >-
      github.ref_type == 'branch'
      && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.bump.outputs.release }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      # Full history: release-plz finds the last tag and reads every commit since
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The glibc build, not the musl one install actions pick: on a native Linux
      # runner the musl build misreads its main-thread stack and fails every
      # changelog render with "Template parse error: stack limit reached".
      # Pinned by checksum, extracted into a directory of its own.
      - name: Install release-plz
        env:
          RELEASE_PLZ_VERSION: 0.4.1
          RELEASE_PLZ_SHA256: 4b70642e4270eeb7c073a2f16c4c168f9558f4e32bb98f0dd751b26eacd8bef1
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/release-plz"
          mkdir -p "${dir}"
          archive="${dir}/release-plz.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/release-plz/release-plz/releases/download/release-plz-v${RELEASE_PLZ_VERSION}/release-plz-x86_64-unknown-linux-gnu.tar.gz"
          echo "${RELEASE_PLZ_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" -C "${dir}" release-plz
          rm "${archive}"
          echo "${dir}" >> "$GITHUB_PATH"
          "${dir}/release-plz" --version
      - name: Compute the bump
        id: bump
        env:
          # Read-only: release-plz reads pull request numbers for changelog links
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release-plz update
          if git diff --quiet -- Cargo.toml; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing since the last tag cuts a release."
            exit 0
          fi
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          python3 -I .github/scripts/sync-doc-versions.py "${version}"
          .github/scripts/release-notes.sh "${version}" < CHANGELOG.md > notes.md
          {
            echo "release=true"
            echo "version=${version}"
            echo "tag=v${version}"
          } >> "$GITHUB_OUTPUT"
          echo "Next release: v${version}"
          git diff --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bump.outputs.release == 'true'
        with:
          name: bump
          path: |
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
            README.md
            docs/usage.md
            site/index.html
            notes.md
          if-no-files-found: error

  # The same five jobs a pull request runs. This call is also the only run that
  # saves the build cache, because its ref is main.
  ci:
    if: >-
      github.ref_type == 'branch'
      && !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: read
    # The documented local form; actionlint and older runners do not read `$/`
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  # Opens before CI finishes, so the notes can be read while it runs. A draft is
  # invisible to `gtunnel update`, which asks for the latest published release.
  draft:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only the retry helper the step sources, at the commit being released
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump
          path: bump
      - name: Open the draft release
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every gh call below retries a transient 5xx; see the helper
          . .github/scripts/gh-retry.sh
          # A dry run computes the same version a real train would, so it drafts
          # under a name of its own: the real draft is what the tag run publishes,
          # and a dry run from a branch must never replace it.
          if [ "${DRY_RUN}" = "true" ]; then
            TAG="${TAG}-dry-run"
          fi
          # A train whose CI failed leaves its draft behind; the next one replaces
          # it. A published release of this tag means the version was already
          # shipped, and nothing here may touch it.
          # Only "release not found" reads as no release; any other failure of
          # the view fails the step rather than pass for an absent release.
          state=$(release_state "${TAG}")
          if [ "${state}" = "published" ]; then
            echo "::error::${TAG} is already published; refusing to draft it again"
            exit 1
          fi
          if [ "${state}" = "draft" ]; then
            release_delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --yes
          fi
          release_create_draft "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file bump/notes.md \
            --target "${GITHUB_SHA}"

  # Runs only once CI is green and the draft exists: commits the bump and pushes
  # it with its tag in one atomic push, so main never holds one without the other.
  # The tag push is made with RELEASE_TOKEN, so it starts this workflow again,
  # and that run takes the lower half of this file.
  tag:
    needs: [plan, ci, draft]
    if: >-
      needs.plan.outputs.release == 'true'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump
          path: bump
      - name: Commit the bump and push it with the tag
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::RELEASE_TOKEN is not set. Add a fine-grained token with Contents: write as a repository secret."
            exit 1
          fi

          # A newer merge landed while this train ran. Its own train starts from
          # that newer main and its changelog covers these commits too, so this
          # one stands down rather than push a bump onto a main it never tested.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "${GITHUB_SHA}" ]; then
            echo "::notice::main moved past ${GITHUB_SHA}; the newer train releases instead"
            exit 0
          fi

          cp bump/Cargo.toml bump/Cargo.lock bump/CHANGELOG.md bump/README.md .
          cp bump/docs/usage.md docs/usage.md
          cp bump/site/index.html site/index.html

          # The commit is the token owner's, as a push from their laptop would be.
          # A 401 fails at once; only a transient 5xx is retried.
          . .github/scripts/gh-retry.sh
          if ! user=$(GH_TOKEN="${RELEASE_TOKEN}" retry gh api user -q '"\(.id)+\(.login) \(.login)"'); then
            echo "::error::RELEASE_TOKEN was refused; it may be expired or revoked"
            exit 1
          fi
          read -r noreply login <<< "${user}"
          git config user.name "${login}"
          git config user.email "${noreply}@users.noreply.github.com"

          # The landing page rides in the same commit, so its push redeploys it
          git add Cargo.toml Cargo.lock CHANGELOG.md README.md docs/usage.md site/index.html
          git commit --quiet -m "chore(release): ${TAG}"
          git tag -a "${TAG}" -m "${TAG}"

          remote="https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push --atomic "${remote}" HEAD:refs/heads/main "refs/tags/${TAG}"; then
            echo "::error::Pushing ${TAG} failed: RELEASE_TOKEN is missing, expired or lacks Contents: write, or main moved"
            exit 1
          fi
          echo "Pushed $(git rev-parse --short HEAD) and ${TAG}; the tag push starts this workflow again to build it."

  # ---- The build: push of a v* tag --------------------------------------------

  # A tag must name the version Cargo.toml holds; the updater trusts that pairing.
  # A dry run builds whatever its ref holds, as proof, and publishes nothing.
  verify:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A tag is a request to sign and publish a binary, so it must name a commit
      # that is already on main and the version that commit declares. The
      # release-tags ruleset limits who can push a v* tag; this limits what it
      # can point at.
      - name: Match the tag to main and to Cargo.toml
        id: check
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            {
              echo "tag=v${crate}"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            echo "Dispatched build proof of ${crate}; nothing is published."
            exit 0
          fi
          if [ "${GITHUB_REF_NAME}" != "v${crate}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not name the crate version ${crate}; expected v${crate}"
            exit 1
          fi
          commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          git fetch --no-tags --quiet origin main
          if ! git merge-base --is-ancestor "${commit}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${commit}, which is not on main; only a commit on main is released"
            exit 1
          fi
          {
            echo "tag=${GITHUB_REF_NAME}"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.slug }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # `slug` is what the asset is called. It is deliberately not the triple:
        # `unknown` in the vendor slot and `x86_64` for amd64 are exact but tell
        # a visitor nothing. `platform_slug()` in src/update.rs returns these
        # same four strings, and the updater fetches by them, so the two lists
        # must change together
        include:
          - target: aarch64-apple-darwin
            slug: macos-arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            slug: macos-intel
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            slug: linux-amd64
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            slug: linux-arm64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    # id-token mints the short-lived signing certificate from this job's OIDC
    # identity; attestations writes the signed bundle to the repository's
    # attestation store. Neither can push, tag or publish a release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # No build cache here on purpose: these binaries are what `gtunnel update`
      # installs, and a cache written by a pull request run could otherwise
      # decide what a release is built from. The cost is a cold build per tag
      # musl targets cross-compile from glibc runners, so they need a linker
      - name: Install cross linker
        if: endsWith(matrix.target, '-musl')
        run: |
          cargo install cross --locked --version 0.2.5
          echo "CARGO=cross" >> "$GITHUB_ENV"
      - name: Build
        run: ${CARGO:-cargo} build --release --locked --target ${{ matrix.target }}
      # The self-updater downloads gtunnel-<slug>-<tag>.tar.gz and verifies it
      # against gtunnel-<slug>-<tag>.tar.gz.sha256
      - name: Package
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          asset="gtunnel-${{ matrix.slug }}-${TAG}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" gtunnel
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      # A .sha256 published beside its tarball proves the file was not corrupted in
      # transit, not that we built it: whoever could replace the asset could replace
      # the checksum. The attestation is signed with a short-lived certificate tied to
      # this workflow's OIDC identity and recorded in Sigstore's public transparency
      # log, so `gh attestation verify <file> -o gcheliz` establishes that this
      # repository's Release workflow produced that exact byte sequence, with no key
      # for us to keep or lose. Only tag builds are attested; a dispatched run builds
      # throwaway artifacts that nobody downloads
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.verify.outputs.publish == 'true'
        with:
          subject-path: gtunnel-${{ matrix.slug }}-${{ needs.verify.outputs.tag }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtunnel-${{ matrix.slug }}
          path: |
            gtunnel-${{ matrix.slug }}-${{ needs.verify.outputs.tag }}.tar.gz
            gtunnel-${{ matrix.slug }}-${{ needs.verify.outputs.tag }}.tar.gz.sha256
          if-no-files-found: error

  # Uploads to the draft the train opened, then publishes it. Draft first, every
  # asset, then publish: the order immutable releases require, and the reason a
  # half-uploaded release is never what `gtunnel update` finds as latest.
  publish:
    needs: [verify, build]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gtunnel-*
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every gh call below retries a transient 5xx; upload --clobber and
          # edit are idempotent, so a rerun after a lost answer is harmless
          . .github/scripts/gh-retry.sh
          state=$(release_state "${TAG}")
          if [ "${state}" = "published" ]; then
            echo "::error::${TAG} is already published; its assets are not replaced"
            exit 1
          fi
          if [ "${state}" = "draft" ]; then
            retry gh release upload "${TAG}" assets/* --repo "${GITHUB_REPOSITORY}" --clobber
            retry gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
          else
            # Only the train opens a draft, so a tag without one did not come from
            # a merge. Nothing is created from it. To finish a release by hand,
            # open the draft and re-run this job:
            #   gh release create vX.Y.Z --draft --title vX.Y.Z --verify-tag \
            #     --notes-file <(.github/scripts/release-notes.sh X.Y.Z < CHANGELOG.md)
            echo "::error::${TAG} has no draft release; only a tag cut by the release train is published"
            exit 1
          fi

  # Points the Homebrew tap at the release once it is public. The tap is another
  # repository, so the push uses HOMEBREW_TAP_TOKEN, a fine-grained token scoped
  # to that repository with Contents: write and nothing else. The hashes are the
  # ones the build jobs wrote, so the formula names exactly what was published.
  # A failure leaves the release as it is and the formula on the previous
  # version, which `brew upgrade` reads as no update; re-run the job to retry.
  tap:
    needs: [verify, publish]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gtunnel-*
          path: assets
          merge-multiple: true
      - name: Bump the formula and push it to the tap
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. Add a fine-grained token with Contents: write on the tap repository as a repository secret."
            exit 1
          fi

          remote="https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git"
          if ! git clone --quiet --depth 1 "${remote}" tap; then
            echo "::error::Cloning the tap failed: HOMEBREW_TAP_TOKEN is missing, expired or cannot read the tap repository"
            exit 1
          fi

          python3 -I .github/scripts/bump-tap-formula.py "${TAG}" assets tap/Formula/gtunnel.rb
          . .github/scripts/gh-retry.sh
          cd tap
          if git diff --quiet; then
            echo "The tap already points at ${TAG}."
            exit 0
          fi

          # The commit is the token owner's, as a push from their laptop would be
          if ! user=$(GH_TOKEN="${TAP_TOKEN}" retry gh api user -q '"\(.id)+\(.login) \(.login)"'); then
            echo "::error::HOMEBREW_TAP_TOKEN was refused; it may be expired or revoked"
            exit 1
          fi
          read -r noreply login <<< "${user}"
          git config user.name "${login}"
          git config user.email "${noreply}@users.noreply.github.com"

          git add Formula/gtunnel.rb
          git commit --quiet -m "chore(formula): gtunnel ${TAG#v}"
          if ! git push --quiet origin HEAD:main; then
            echo "::error::Pushing the formula failed: HOMEBREW_TAP_TOKEN lacks Contents: write on the tap, or main moved"
            exit 1
          fi
          echo "Pushed $(git rev-parse --short HEAD): the tap points at ${TAG}."
