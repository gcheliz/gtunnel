name: Release

on:
  push:
    tags: ["v*"]
  # The matrix is the only proof the four targets still compile, and a tag is
  # an expensive place to find out they do not. This runs the build on demand;
  # publishing stays tag-only, below.
  workflow_dispatch:

# The release job alone may write; a build step runs third-party actions and
# must not be able to publish, and every action below is pinned to a commit
# because these binaries are what `gtunnel update` installs
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # No build cache here on purpose: these binaries are what `gtunnel update`
      # installs, and a cache written by a pull request run could otherwise
      # decide what a release is built from. The cost is a cold build per tag
      # musl targets cross-compile from glibc runners, so they need a linker
      - name: Install cross linker
        if: endsWith(matrix.target, '-musl')
        run: |
          cargo install cross --locked --version 0.2.5
          echo "CARGO=cross" >> "$GITHUB_ENV"
      - name: Build
        run: ${CARGO:-cargo} build --release --locked --target ${{ matrix.target }}
      # The self-updater downloads gtunnel-<target>.tar.gz and verifies it
      # against gtunnel-<target>.tar.gz.sha256, so both names are fixed
      - name: Package
        run: |
          set -euo pipefail
          asset="gtunnel-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" gtunnel
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtunnel-${{ matrix.target }}
          path: |
            gtunnel-${{ matrix.target }}.tar.gz
            gtunnel-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    # A dispatched run builds and stops there: it has no tag to name a release
    # after, and `gtunnel update` must never meet one it cannot resolve
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            assets/*
