name: Release

on:
  push:
    tags: ["v*"]
  # The matrix is the only proof the four targets still compile, and a tag is
  # an expensive place to find out they do not. This runs the build on demand;
  # publishing stays tag-only, below.
  workflow_dispatch:

# Nothing inherits write access. The release job alone may write repository
# contents, and the build job's extra grants only let it sign what it just built
# — a build step runs third-party actions and must not be able to publish. Every
# action below is pinned to a commit because these binaries are what
# `gtunnel update` installs
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `slug` is what the asset is called. It is deliberately not the triple:
        # `unknown` in the vendor slot and `x86_64` for amd64 are exact but tell
        # a visitor nothing. `platform_slug()` in src/update.rs returns these
        # same four strings, and the updater fetches by them, so the two lists
        # must change together
        include:
          - target: aarch64-apple-darwin
            slug: macos-arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            slug: macos-intel
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            slug: linux-amd64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            slug: linux-arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    # id-token mints the short-lived signing certificate from this job's OIDC
    # identity; attestations writes the signed bundle to the repository's
    # attestation store. Neither can push, tag or publish a release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # No build cache here on purpose: these binaries are what `gtunnel update`
      # installs, and a cache written by a pull request run could otherwise
      # decide what a release is built from. The cost is a cold build per tag
      # musl targets cross-compile from glibc runners, so they need a linker
      - name: Install cross linker
        if: endsWith(matrix.target, '-musl')
        run: |
          cargo install cross --locked --version 0.2.5
          echo "CARGO=cross" >> "$GITHUB_ENV"
      - name: Build
        run: ${CARGO:-cargo} build --release --locked --target ${{ matrix.target }}
      # The self-updater downloads gtunnel-<slug>.tar.gz and verifies it
      # against gtunnel-<slug>.tar.gz.sha256, so both names are fixed
      - name: Package
        run: |
          set -euo pipefail
          asset="gtunnel-${{ matrix.slug }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" gtunnel
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      # A .sha256 published beside its tarball proves the file was not corrupted in
      # transit, not that we built it: whoever could replace the asset could replace
      # the checksum. The attestation is signed with a short-lived certificate tied to
      # this workflow's OIDC identity and recorded in Sigstore's public transparency
      # log, so `gh attestation verify <file> -o gcheliz` establishes that this
      # repository's Release workflow produced that exact byte sequence, with no key
      # for us to keep or lose. Only tag builds are attested; a dispatched run builds
      # throwaway artifacts that nobody downloads
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: gtunnel-${{ matrix.slug }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gtunnel-${{ matrix.slug }}
          path: |
            gtunnel-${{ matrix.slug }}.tar.gz
            gtunnel-${{ matrix.slug }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    # A dispatched run builds and stops there: it has no tag to name a release
    # after, and `gtunnel update` must never meet one it cannot resolve
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            assets/*
