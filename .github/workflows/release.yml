name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  # The matrix is the only proof the four targets still compile, and a tag is
  # an expensive place to find out they do not. This runs the build on demand;
  # publishing stays tag-only, below.
  workflow_dispatch:

# Nothing inherits write access. The release job alone may write repository
# contents, and the build job's extra grants only let it sign what it just built
# — a build step runs third-party actions and must not be able to publish. Every
# action below is pinned to a commit because these binaries are what
# `gtunnel update` installs
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # On tag push, verify the tag matches Cargo.toml.
  # On push to main, check whether Cargo.toml's version is already tagged;
  # if untagged (e.g. release PR merged), trigger the automated release pipeline.
  verify:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine if release is required and verify tag
        id: check
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          expected_tag="v${crate}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=${expected_tag}" >> "$GITHUB_OUTPUT"
            echo "version=${crate}" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch build proof"
            exit 0
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] || [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [ "${tag}" != "${expected_tag}" ]; then
              echo "::error::tag ${tag} does not name the crate version ${crate}; expected ${expected_tag}"
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "version=${crate}" >> "$GITHUB_OUTPUT"
            echo "tag ${tag} matches Cargo.toml ${crate}"
            exit 0
          fi

          # Push to main: check if Cargo.toml was modified in this push
          if [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            diff_range="${BEFORE_SHA}..HEAD"
          else
            diff_range="HEAD~1..HEAD"
          fi

          if ! git diff --name-only "${diff_range}" | grep -q "^Cargo.toml$"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=${expected_tag}" >> "$GITHUB_OUTPUT"
            echo "version=${crate}" >> "$GITHUB_OUTPUT"
            echo "Cargo.toml was not changed in this push to main; skipping release build."
            exit 0
          fi

          # Check if tag already exists
          if git rev-parse -q --verify "refs/tags/${expected_tag}" >/dev/null; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=${expected_tag}" >> "$GITHUB_OUTPUT"
            echo "version=${crate}" >> "$GITHUB_OUTPUT"
            echo "Version ${crate} is already tagged (${expected_tag}); skipping release build."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${expected_tag}" >> "$GITHUB_OUTPUT"
            echo "version=${crate}" >> "$GITHUB_OUTPUT"
            echo "Version ${crate} is untagged. Triggering release for ${expected_tag}."
          fi

  build:
    name: Build ${{ matrix.slug }}
    needs: verify
    if: github.event_name == 'workflow_dispatch' || needs.verify.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        # `slug` is what the asset is called. It is deliberately not the triple:
        # `unknown` in the vendor slot and `x86_64` for amd64 are exact but tell
        # a visitor nothing. `platform_slug()` in src/update.rs returns these
        # same four strings, and the updater fetches by them, so the two lists
        # must change together
        include:
          - target: aarch64-apple-darwin
            slug: macos-arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            slug: macos-intel
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            slug: linux-amd64
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            slug: linux-arm64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    # id-token mints the short-lived signing certificate from this job's OIDC
    # identity; attestations writes the signed bundle to the repository's
    # attestation store. Neither can push, tag or publish a release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      # No build cache here on purpose: these binaries are what `gtunnel update`
      # installs, and a cache written by a pull request run could otherwise
      # decide what a release is built from. The cost is a cold build per tag
      # musl targets cross-compile from glibc runners, so they need a linker
      - name: Install cross linker
        if: endsWith(matrix.target, '-musl')
        run: |
          cargo install cross --locked --version 0.2.5
          echo "CARGO=cross" >> "$GITHUB_ENV"
      - name: Build
        run: ${CARGO:-cargo} build --release --locked --target ${{ matrix.target }}
      # The self-updater downloads gtunnel-<slug>-<tag>.tar.gz and verifies it
      # against gtunnel-<slug>-<tag>.tar.gz.sha256
      - name: Package
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          asset="gtunnel-${{ matrix.slug }}-${TAG}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" gtunnel
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      # A .sha256 published beside its tarball proves the file was not corrupted in
      # transit, not that we built it: whoever could replace the asset could replace
      # the checksum. The attestation is signed with a short-lived certificate tied to
      # this workflow's OIDC identity and recorded in Sigstore's public transparency
      # log, so `gh attestation verify <file> -o gcheliz` establishes that this
      # repository's Release workflow produced that exact byte sequence, with no key
      # for us to keep or lose. Only tag builds are attested; a dispatched run builds
      # throwaway artifacts that nobody downloads
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.verify.outputs.should_release == 'true'
        with:
          subject-path: gtunnel-${{ matrix.slug }}-${{ needs.verify.outputs.tag }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gtunnel-${{ matrix.slug }}
          path: |
            gtunnel-${{ matrix.slug }}-${{ needs.verify.outputs.tag }}.tar.gz
            gtunnel-${{ matrix.slug }}-${{ needs.verify.outputs.tag }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [verify, build]
    # A dispatched run builds and stops there: it has no tag to name a release
    # after, and `gtunnel update` must never meet one it cannot resolve
    if: needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure tag exists on remote
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Creating tag ${TAG} at ${GITHUB_SHA}..."
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="${GITHUB_SHA}"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            assets/*
