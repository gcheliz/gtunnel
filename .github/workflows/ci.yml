name: CI

# Pull requests run this directly. A push to main does not: release.yml calls it
# as the first gate of the release train, so the tree on main is tested once, and
# that call is also the run that writes the cache, because its ref is main.
on:
  pull_request:
  workflow_call:

# Nothing here publishes or comments, so the token is read-only for every job
# and a compromised step cannot push or tag
permissions:
  contents: read

# Pushing twice to a branch used to leave five jobs running against a commit
# nobody will merge. The newer push supersedes them. The event name keeps a
# called run inside a release train in a group of its own, so a pull request can
# never cancel it, and `main` never cancels itself.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are worthless to a runner that is destroyed at the end
  # of the job, and they roughly double what the cache has to carry.
  CARGO_INCREMENTAL: 0
  # The default is 3 attempts with no delay, which turns a blip in the crates.io
  # CDN into a red build.
  CARGO_NET_RETRY: 10

jobs:
  # One job, five checks. Each matrix entry is one required status check, and its
  # `name` is the context the main ruleset requires, so the list below and the
  # ruleset's list must change together.
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test (ubuntu-24.04)
            check: test
            os: ubuntu-24.04
            toolchain: stable
            cache: test
            cache-targets: true
          - name: test (macos-latest)
            check: test
            os: macos-latest
            toolchain: stable
            cache: test
            cache-targets: true
          # A vulnerable crate reaches users as a signed-for binary `gtunnel
          # update` installs, so the advisory check gates the same commits the
          # tests do. `cargo audit` reads Cargo.lock and compiles nothing of
          # ours, so its cache keeps the installed binary and no target dir.
          - name: audit
            check: audit
            os: ubuntu-24.04
            toolchain: stable
            cache: audit
            cache-targets: false
          # A declared rust-version that nothing checks rots on the next
          # dependency bump. This entry is what makes the Cargo.toml field a fact.
          - name: msrv
            check: msrv
            os: ubuntu-24.04
            toolchain: "1.88.0"
            cache: msrv
            cache-targets: true
          # The workflows hold a release token, so a template injection or an
          # unpinned action in them is the most expensive mistake in the
          # repository. zizmor reads them as text, offline.
          - name: zizmor
            check: zizmor
            os: ubuntu-24.04
            toolchain: stable
            cache: zizmor
            cache-targets: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.check == 'test' && 'rustfmt, clippy' || '' }}
      # Only `main` writes a cache. A pull request restores one and discards what
      # it built: without this every PR run saved its own entry, and the 10 GB
      # repository limit evicts by age, so a busy day of PRs used to push out the
      # one entry every future run starts from.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: ${{ matrix.cache-targets }}
      - name: Format
        if: matrix.check == 'test'
        run: cargo fmt --check
      - name: Clippy
        if: matrix.check == 'test'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        if: matrix.check == 'test'
        run: cargo test
      # The install snippets quote the version a reader downloads. The release
      # train rewrites them in the bump commit, so a mismatch here means a doc
      # edit reintroduced an old version by hand.
      - name: Verify documentation versions
        if: matrix.check == 'test' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          crate_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          grep -q "VERSION=\"v${crate_version}\"" README.md
          grep -q "VERSION=\"v${crate_version}\"" docs/usage.md
          grep -q "gtunnel ${crate_version}" docs/usage.md
          grep -q "(current: v${crate_version})" docs/usage.md
      # Installed rather than wrapped in an action: one less third-party step
      # with a token in scope, and the version is pinned here
      - name: Audit dependencies
        if: matrix.check == 'audit'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings
      - name: Check on the declared MSRV
        if: matrix.check == 'msrv'
        run: cargo check --locked --all-targets
      - name: Lint the workflows
        if: matrix.check == 'zizmor'
        run: |
          cargo install zizmor --locked --version 1.31.1
          zizmor --offline .github/workflows
