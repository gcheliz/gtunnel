name: CI

# Pull requests run this directly. A push to main does not: cut-release.yml calls it
# as the first gate of the release train, so the tree on main is tested once, and
# that call is also the run that writes the cache, because its ref is main.
on:
  pull_request:
  workflow_call:

# Nothing here publishes or comments, so the token is read-only for every job
# and a compromised step cannot push or tag
permissions:
  contents: read

# Pushing twice to a branch used to leave five jobs running against a commit
# nobody will merge. The newer push supersedes them. The event name keeps a
# called run inside a release train in a group of its own, so a pull request can
# never cancel it, and `main` never cancels itself.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are worthless to a runner that is destroyed at the end
  # of the job, and they roughly double what the cache has to carry.
  CARGO_INCREMENTAL: 0
  # The default is 3 attempts with no delay, which turns a blip in the crates.io
  # CDN into a red build.
  CARGO_NET_RETRY: 10

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # Only `main` writes a cache. A pull request restores one and discards what
      # it built: without this every PR run saved its own entry, and the 10 GB
      # repository limit evicts by age, so a busy day of PRs used to push out the
      # one entry every future run starts from.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  # A vulnerable crate reaches users as a signed-for binary `gtunnel update`
  # installs, so the advisory check gates the same commits the tests do.
  # cargo-audit is installed rather than wrapped in an action: one less
  # third-party step with a token in scope, and the version is pinned here
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: audit
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # `cargo audit` reads Cargo.lock against the advisory database and
          # compiles nothing of ours, so a target directory here would be an
          # empty one saved and restored on every run. The cargo-audit binary
          # itself lives in CARGO_HOME/bin, which `cache-bin` still covers.
          cache-targets: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit dependencies
        run: cargo audit --deny warnings

  # A declared rust-version that nothing checks rots on the next dependency bump.
  # This job is the only thing that makes the Cargo.toml field a fact.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check on the declared MSRV
        run: cargo check --locked --all-targets

  # The workflows hold a release token, so a template injection or an unpinned
  # action in them is the most expensive mistake in the repository. zizmor reads
  # them offline, so the job needs no token beyond the read-only checkout, and
  # it is installed the way cargo-audit is: pinned, no third-party action
  zizmor:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: zizmor
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # zizmor reads the workflow files as text; it never touches the crate.
          cache-targets: false
      - name: Install zizmor
        run: cargo install zizmor --locked --version 1.31.1
      - name: Lint the workflows
        run: zizmor --offline .github/workflows
