[workspace]
# gtunnel is not on crates.io — the name there belongs to an unrelated crate — so
# release-plz cannot ask the registry what the last version was. `git_only` makes it
# read git tags instead, and skips `cargo publish` entirely.
git_only = true

# Must match the tags that already exist and the `tags: ["v*"]` trigger in
# release.yml. release-plz's default for a single package would be
# `gtunnel-v<version>`, which that trigger would still catch but which would read
# as a different series.
git_tag_name = "v{{ version }}"

# This repository only ever runs `release-plz update`, inside release.yml, so
# neither of these fires today. They are set so that running `release` by mistake
# cannot surprise anyone: the train in release.yml pushes the tag with the bump
# commit, and the tag run of the same file publishes the release, because only it
# has the binaries and their attestations to attach.
git_tag_enable = false
git_release_enable = false

changelog_update = true

# Every prefix that writes a changelog line cuts a release, so a merge reaches
# users without anyone dispatching anything. Tests, CI and chores write no line
# and change nothing a user gets; releasing them would ship identical binaries
# under a new number with empty notes.
#
# A commit that changes only Cargo.lock never reaches this regex: release-plz drops
# it from the package's history whatever its subject says. When the locked
# dependencies of the binary differ from the last tag, it adds a commit of its own
# instead, titled as in the second alternative, so that one releases too.
release_commits = "^(feat|fix|perf|refactor|docs)|^chore: update Cargo\\.lock dependencies$"

[changelog]
header = """# Changelog

Notable changes per release. Dates are the release date; an unreleased section is
what is on `main` and not yet tagged.
"""

# One section per kind of change, in the order a reader cares about. A commit whose
# subject carries no recognised prefix is dropped rather than filed under a heading
# that would misdescribe it.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  # The commit release-plz adds for a lockfile-only update, see `release_commits`.
  # It must come before the `^chore` skip, or the release has no notes to publish.
  { message = "^chore: update Cargo\\.lock dependencies", group = "Dependencies" },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
  { message = "^build", skip = true },
  { message = ".*", skip = true },
]
